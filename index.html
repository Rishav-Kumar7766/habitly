
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitly</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f6ff;
            font-family: 'Poppins', sans-serif;
            color: #20243a;
        }

        .container {
            text-align: center;
            background: white;
            padding: 55px 75px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(40, 40, 100, 0.08);
        }

        h1 {
            color: #5b4bdb;
            font-size: 48px;
            font-weight: 700;
            margin: 0 0 10px;
        }

        p {
            color: #667085;
            font-size: 16px;
            margin: 0;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Habitly</h1>
        <p>Created by Rishav Kumar</p>
    </main>
</body>
</html>
